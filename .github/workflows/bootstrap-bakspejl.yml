name: Bootstrap Bakspejl umbrella routing

on:
  push:
    branches:
      - codex/bakspejl-umbrella-routing

permissions:
  contents: write
  pull-requests: write
  checks: write
  actions: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Implement Bakspejl umbrella routing
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const read = p => fs.readFileSync(p, 'utf8');
          const write = (p,s) => { fs.mkdirSync(require('path').dirname(p),{recursive:true}); fs.writeFileSync(p,s); };
          const once=(s,a,b,l)=>{ if(s.includes(b)) return s; if(!s.includes(a)) throw new Error('Missing patch anchor: '+l); return s.replace(a,b); };
          const transform=(s,pairs)=>{ for(const [a,b] of pairs) s=s.split(a).join(b); return s; };

          let br=transform(read('supabase/functions/import-podcast-episodes/djaevlen-routing.mjs'),[
            ['DJAEVLEN','BAKSPEJL'],['Djaevlen','Bakspejl'],['djaevlen_i_detaljen','bakspejl'],['djaevlen-i-detaljen','bakspejl'],
            ['sheet_danmarks_vaerste_massemorder_rss','sheet_la_riots_rss'],['danmarks vaerste massemorder','la riots'],['Djævlen i detaljen','Bakspejl'],['djaevlen:','bakspejl:']
          ]);
          br=br.replace('const routes = [];','const routes = [{ key: "bakspejl:dr-promo", podcast_key: BAKSPEJL_IMPORT_LABEL, priority: 100, title: { patterns: [/^h(?:ø|o)r flere afsnit af denne\\b.*\\bdr lyd\\b/iu] } }];');
          write('supabase/functions/import-podcast-episodes/bakspejl-routing.mjs',br);

          let ba=transform(read('scripts/djaevlen-auto-discovery.mjs'),[
            ['DJAEVLEN','BAKSPEJL'],['Djaevlen','Bakspejl'],['djaevlen-auto-v1','bakspejl-auto-v1'],['Djævlen i detaljen','Bakspejl'],
            ['66f271c4b75d19480fa40d01','67e14d6f6273e8fc7077aa53'],['2026-09-23T14:25:00.000Z','2026-10-06T20:32:20.000Z']
          ]);
          ba=ba.replace('(?:teaser|trailer|bonus|arkiv)','(?:teaser|trailer|bonus|arkiv|hør flere afsnit)');
          write('scripts/bakspejl-auto-discovery.mjs',ba);

          let run=transform(read('scripts/run-djaevlen-auto-discovery.mjs'),[
            ['djaevlen-auto-discovery','bakspejl-auto-discovery'],['discoverDjaevlenChildren','discoverBakspejlChildren'],
            ['auto-discovered-djaevlen','auto-discovered-bakspejl'],['djaevlen-i-detaljen','bakspejl'],['Djævlen','Bakspejl']
          ]);
          write('scripts/run-bakspejl-auto-discovery.mjs',run);

          let dt=transform(read('scripts/test-djaevlen-auto-discovery.mjs'),[
            ['djaevlen-auto-discovery','bakspejl-auto-discovery'],['Djaevlen','Bakspejl'],['Djævlen','Bakspejl'],['../supabase/functions/import-podcast-episodes/djaevlen-routing.mjs','../supabase/functions/import-podcast-episodes/bakspejl-routing.mjs'],
            ['djaevlen-auto-v1','bakspejl-auto-v1'],['2026-09-23T14:25:00.000Z','2026-10-06T20:32:20.000Z'],
            ['2026-09-24T00:00:00Z','2026-10-07T00:00:00Z'],['2026-09-25T00:00:00Z','2026-10-08T00:00:00Z'],
            ['2026-09-23T14:25:01.000Z','2026-10-06T20:32:21.000Z']
          ]);
          write('scripts/test-bakspejl-auto-discovery.mjs',dt);

          let wf=transform(read('.github/workflows/discover-djaevlen-children.yml'),[
            ['Djævlen','Bakspejl'],['djaevlen','bakspejl'],['17 */6','47 */6']
          ]);
          write('.github/workflows/discover-bakspejl-children.yml',wf);
          write('data/auto-discovered-bakspejl.json',JSON.stringify({version:1,baseline_published_at:'2026-10-06T20:32:20.000Z',processed_guids:[],records:[]},null,2)+'\n');

          const routingTest=`import assert from "node:assert/strict";
          import { buildBakspejlRoutes, BAKSPEJL_FEED_KEY, BAKSPEJL_SOURCE } from "../supabase/functions/import-podcast-episodes/bakspejl-routing.mjs";
          import { mapEpisodes, parseFeed, routeEpisodes } from "../supabase/functions/import-podcast-episodes/core.ts";
          import { mergeSheetFeedConfigs } from "../supabase/functions/import-podcast-episodes/runtime-feed-config.ts";
          const rows=[{Titel:"Geniet i lommen",Hovedserie:"Bakspejl","Podcast-ID":"geniet i lommen"},{Titel:"Da aids kom til Danmark",Hovedserie:"Bakspejl","Podcast-ID":"da aids kom til danmark"},{Titel:"LA Riots",Hovedserie:"Bakspejl","Podcast-ID":"la riots"}];
          const cfg=mergeSheetFeedConfigs({rows}).configs[BAKSPEJL_FEED_KEY]; assert.equal(cfg.source,BAKSPEJL_SOURCE); assert.equal(cfg.enabled,true);
          const xml='<rss><channel><item><guid>a</guid><title>Geniet i lommen 1:4</title></item><item><guid>b</guid><title>Da aids kom til Danmark 2:4</title></item><item><guid>p</guid><title>Hør flere afsnit af denne  i DR Lyd</title></item><item><guid>x</guid><title>Ukendt ny serie 1:3</title></item></channel></rss>';
          const routed=routeEpisodes(mapEpisodes(parseFeed(xml),cfg,"2026-10-06T00:00:00Z").episodes,cfg);
          assert.equal(routed.episodes.find(e=>e.external_guid==='a').podcast_key,'geniet i lommen'); assert.equal(routed.episodes.find(e=>e.external_guid==='b').podcast_key,'da aids kom til danmark');
          assert.equal(routed.episodes.find(e=>e.external_guid==='p').is_active,false); assert.equal(routed.report.unmatched.length,1); assert.equal(buildBakspejlRoutes(rows).routes.length,4);
          console.log('Bakspejl umbrella routing tests passed');\n`;
          write('scripts/test-bakspejl-umbrella-routing.mjs',routingTest);

          const migration=`begin;
          create temporary table bakspejl_episode_identity_before on commit drop as select id,source,external_guid,podcast_key from public.podcast_episodes where source='sheet_la_riots_rss' and external_guid in ('11162611001','11162611002','11162611003','11162611004','11162611005','11162611006','11162611007','11162611008','11162611009','11162611010','11162611011','16122471004');
          update public.podcast_episodes set podcast_key=case when external_guid between '11162611001' and '11162611004' then 'geniet i lommen' when external_guid between '11162611005' and '11162611008' then 'da aids kom til danmark' when external_guid in ('11162611009','11162611010') then 'manden bag glasset' else 'la riots' end,updated_at=now() where source='sheet_la_riots_rss' and external_guid in ('11162611001','11162611002','11162611003','11162611004','11162611005','11162611006','11162611007','11162611008','11162611009','11162611010','11162611011','16122471004');
          update public.podcast_episodes set is_active=false,metadata=coalesce(metadata,'{}'::jsonb)||'{"rateable":false,"exclusion_reason":"dr_promo"}'::jsonb,updated_at=now() where source='sheet_la_riots_rss' and external_guid='16122471004';
          do $$ begin if exists(select 1 from bakspejl_episode_identity_before b left join public.podcast_episodes p on p.id=b.id where p.id is null or p.source is distinct from b.source or p.external_guid is distinct from b.external_guid) then raise exception 'Bakspejl migration changed an existing episode identity'; end if; end $$;
          commit;\n`;
          write('supabase/migrations/20261006223000_route_bakspejl_existing_episode_identities.sql',migration);

          let f=read('supabase/functions/import-podcast-episodes/feed-config.ts');
          f=once(f,'import { DJAEVLEN_FEED_KEY, DJAEVLEN_FEED_URL, DJAEVLEN_IMPORT_LABEL, DJAEVLEN_SOURCE } from "./djaevlen-routing.mjs";','import { DJAEVLEN_FEED_KEY, DJAEVLEN_FEED_URL, DJAEVLEN_IMPORT_LABEL, DJAEVLEN_SOURCE } from "./djaevlen-routing.mjs";\nimport { BAKSPEJL_FEED_KEY, BAKSPEJL_FEED_URL, BAKSPEJL_IMPORT_LABEL, BAKSPEJL_SOURCE } from "./bakspejl-routing.mjs";','feed import');
          f=once(f,'  "podimo_grebet_af_gvfb": {','  [BAKSPEJL_FEED_KEY]: { podcast_key: BAKSPEJL_IMPORT_LABEL, source: BAKSPEJL_SOURCE, feed_url: BAKSPEJL_FEED_URL, routes: [], enabled: false },\n  "podimo_grebet_af_gvfb": {','feed owner');
          write('supabase/functions/import-podcast-episodes/feed-config.ts',f);

          let r=read('supabase/functions/import-podcast-episodes/runtime-feed-config.ts');
          r=once(r,'import { buildDjaevlenRoutes, DJAEVLEN_FEED_KEY } from "./djaevlen-routing.mjs";','import { buildDjaevlenRoutes, DJAEVLEN_FEED_KEY } from "./djaevlen-routing.mjs";\nimport { buildBakspejlRoutes, BAKSPEJL_FEED_KEY } from "./bakspejl-routing.mjs";','runtime import');
          r=once(r,'  djaevlen_route_count: number;','  djaevlen_route_count: number;\n  bakspejl_route_count: number;','runtime type');
          r=once(r,'  const djaevlenOwner = manualStaticConfigs[DJAEVLEN_FEED_KEY];','  const djaevlenOwner = manualStaticConfigs[DJAEVLEN_FEED_KEY];\n  const bakspejl = buildBakspejlRoutes(rows);\n  const bakspejlOwner = manualStaticConfigs[BAKSPEJL_FEED_KEY];','runtime build');
          r=once(r,'    } : {})\n  };','    } : {}),\n    ...(bakspejlOwner ? { [BAKSPEJL_FEED_KEY]: { ...bakspejlOwner, routes: bakspejl.routes, enabled: bakspejl.routes.length > 1 } } : {})\n  };','runtime configs');
          r=once(r,'      djaevlen_route_count: djaevlen.routes.length,','      djaevlen_route_count: djaevlen.routes.length,\n      bakspejl_route_count: bakspejl.routes.length,','runtime audit');
          r=once(r,'    djaevlen_route_count: 0,','    djaevlen_route_count: 0,\n    bakspejl_route_count: 0,','runtime base audit');
          write('supabase/functions/import-podcast-episodes/runtime-feed-config.ts',r);

          let c=read('supabase/functions/import-podcast-episodes/core.ts');
          c=once(c,'function isTeaserOrTrailerTitle(value: unknown): boolean {\n  return /\\b(?:teaser|trailer)\\b/i.test(normalizeText(value));\n}','function isTeaserOrTrailerTitle(value: unknown): boolean {\n  const title = normalizeText(value);\n  return /\\b(?:teaser|trailer)\\b/i.test(title) || /^hør flere afsnit af denne\\b.*\\bdr lyd\\b/i.test(title);\n}','promo exclusion');
          write('supabase/functions/import-podcast-episodes/core.ts',c);

          let app=read('app.js');
          app=once(app,'  if (!podcastId) return null;\n\n  const rawFeed = normalizeText(podcast?.rawFeed || podcast?.Feed);','  if (!podcastId) return null;\n\n  const mainSeries = normalizeText(podcast?.mainSeries || podcast?.Hovedserie);\n  if (normalizeMatchKey(mainSeries) === normalizeMatchKey("Bakspejl")) return { podcastKey: podcastId, databasePodcastKey: podcastId, displayName: podcast?.title || podcastId, searchPlaceholder: `Søg i ${podcast?.title || podcastId}-episoder`, enabled: true, persistence: "supabase", includeManualEpisodes: false };\n\n  const rawFeed = normalizeText(podcast?.rawFeed || podcast?.Feed);','frontend Bakspejl');
          write('app.js',app);

          let sync=read('scripts/sync-sheet-data.mjs');
          sync=once(sync,'import { mergeAutoDiscoveredDjaevlenRows } from "./djaevlen-auto-discovery.mjs";','import { mergeAutoDiscoveredDjaevlenRows } from "./djaevlen-auto-discovery.mjs";\nimport { mergeAutoDiscoveredBakspejlRows } from "./bakspejl-auto-discovery.mjs";','sync import');
          sync=once(sync,'  const registry = JSON.parse(await readFile(path.join(repoRoot, "data", "auto-discovered-djaevlen.json"), "utf8"));\n  const catalogueRows = mergeAutoDiscoveredDjaevlenRows(sheetCatalogueRows, registry).map((row) => row.catalogue_id ? row : {','  const registry = JSON.parse(await readFile(path.join(repoRoot, "data", "auto-discovered-djaevlen.json"), "utf8"));\n  const bakspejlRegistry = JSON.parse(await readFile(path.join(repoRoot, "data", "auto-discovered-bakspejl.json"), "utf8"));\n  const catalogueRows = mergeAutoDiscoveredBakspejlRows(mergeAutoDiscoveredDjaevlenRows(sheetCatalogueRows, registry), bakspejlRegistry).map((row) => row.catalogue_id ? row : {','sync merge');
          write('scripts/sync-sheet-data.mjs',sync);

          let gate=read('scripts/critical-regression-gate.mjs');
          gate=once(gate,'  ["Djævlen umbrella routing", ["--experimental-strip-types", "scripts/test-djaevlen-umbrella-routing.mjs"]],','  ["Djævlen umbrella routing", ["--experimental-strip-types", "scripts/test-djaevlen-umbrella-routing.mjs"]],\n  ["Bakspejl umbrella routing", ["--experimental-strip-types", "scripts/test-bakspejl-umbrella-routing.mjs"]],','critical gate');
          write('scripts/critical-regression-gate.mjs',gate);
          NODE
      - name: Run Bakspejl tests
        run: |
          node --experimental-strip-types scripts/test-bakspejl-umbrella-routing.mjs
          node scripts/test-bakspejl-auto-discovery.mjs
          node --check app.js
          node scripts/critical-regression-gate.mjs
      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js scripts data/auto-discovered-bakspejl.json supabase/functions/import-podcast-episodes supabase/migrations/20261006223000_route_bakspejl_existing_episode_identities.sql
          git commit -m "feat: automate Bakspejl umbrella episodes"
          impl=$(git rev-parse HEAD)
          git checkout -B codex/bakspejl-umbrella-clean origin/main
          git cherry-pick "$impl"
          git push origin HEAD:codex/bakspejl-umbrella-clean
      - name: Open PR and enable auto-merge
        if: ${{ false }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(gh pr create --base main --head "$GITHUB_REF_NAME" --title "feat: automate Bakspejl umbrella episodes" --body "Adds safe Bakspejl umbrella routing, identity-preserving migration, frontend episode loading and additive discovery. Existing episode UUIDs are preserved so episode ratings remain attached.")
          gh pr merge --auto --merge "$url"
