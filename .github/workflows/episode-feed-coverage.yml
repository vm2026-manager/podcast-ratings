name: Episode feed adapter and production coverage

on:
  workflow_dispatch:
  schedule:
    - cron: "37 6 * * *"
  push:
    branches:
      - main
    paths:
      - "data/podcasts.json"
      - "supabase/functions/import-podcast-episodes/feed-config.ts"
      - "supabase/functions/import-podcast-episodes/runtime-feed-config.ts"
      - "scripts/monitor-episode-feed-coverage.mjs"
      - "scripts/episode-feed-post-import.mjs"
      - "scripts/test-episode-feed-post-import.mjs"
      - "scripts/audit-frihedsbrevet-sources.mjs"
      - "scripts/discover-fri-mads-releases.mjs"
      - "scripts/test-fri-mads-discovery.mjs"
      - "scripts/fixtures/fri-mads-overview-snapshot.mjs"
      - "scripts/update-fri-mads-article-sidecar.mjs"
      - "scripts/test-fri-mads-article-sidecar.mjs"
      - "scripts/test-fri-mads-article-preview.mjs"
      - "data/fri-mads-articles.json"
      - "app.js"
      - "style.css"
      - "docs/fri-mads-discovery.md"
      - ".github/workflows/episode-feed-coverage.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: episode-feed-coverage
  cancel-in-progress: false

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Fri Mads sidecar and discovery contract tests
        shell: bash
        run: |
          node scripts/test-fri-mads-discovery.mjs
          node scripts/test-fri-mads-article-sidecar.mjs
          node scripts/test-fri-mads-article-sidecar-workflow.mjs
      - name: Discover current Fri Mads overview and stage bounded article metadata
        id: fri-mads-sidecar
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          FRI_MADS_DISCOVERY_REPORT_FILE: ${{ runner.temp }}/fri-mads-discovery.json
        shell: bash
        run: |
          node scripts/discover-fri-mads-releases.mjs --dry-run --report-file "$FRI_MADS_DISCOVERY_REPORT_FILE"
          node scripts/update-fri-mads-article-sidecar.mjs --report-file "$FRI_MADS_DISCOVERY_REPORT_FILE"
          if git diff --quiet -- data/fri-mads-articles.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Require trusted token for real pull_request checks
        id: fri-mads-token-preflight
        if: github.ref == 'refs/heads/main' && steps.fri-mads-sidecar.outcome == 'success' && steps.fri-mads-sidecar.outputs.changed == 'true'
        continue-on-error: true
        env:
          CATALOGUE_SYNC_PR_TOKEN: ${{ secrets.CATALOGUE_SYNC_PR_TOKEN }}
        shell: bash
        run: |
          if [ -z "$CATALOGUE_SYNC_PR_TOKEN" ]; then
            echo "::error::CATALOGUE_SYNC_PR_TOKEN is missing. Refusing to publish Fri Mads metadata without real pull_request checks."
            exit 1
          fi

      - name: Verify trusted token repository access
        id: fri-mads-token-check
        if: github.ref == 'refs/heads/main' && steps.fri-mads-token-preflight.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CATALOGUE_SYNC_PR_TOKEN }}
        shell: bash
        run: gh api "repos/${GITHUB_REPOSITORY}" --silent

      - name: Create or update the bounded Fri Mads metadata PR
        id: fri-mads-pr
        if: github.ref == 'refs/heads/main' && steps.fri-mads-token-check.outcome == 'success'
        continue-on-error: true
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.CATALOGUE_SYNC_PR_TOKEN }}
          branch: automation/fri-mads-article-feed
          base: main
          title: Update Fri Mads article metadata
          commit-message: "chore: update verified Fri Mads article metadata"
          body: |
            Automated, bounded update of the public Fri Mads article metadata sidecar from the approved official series overview.

            This PR contains only `data/fri-mads-articles.json`. It does not change the catalogue, podcast identities, episode records, ratings, Google Sheets, Supabase, or article content. The independent Critical Regression Gate must pass on this exact pull request head before automatic merge.
          add-paths: data/fri-mads-articles.json

      - name: Read current Fri Mads metadata PR head
        id: fri-mads-pr-head
        if: github.ref == 'refs/heads/main' && steps.fri-mads-pr.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CATALOGUE_SYNC_PR_TOKEN }}
        shell: bash
        run: |
          pr_json=$(gh pr list --base main --head automation/fri-mads-article-feed --state open --json number,headRefOid --jq '.[0]')
          if [ "$pr_json" = "null" ] || [ -z "$pr_json" ]; then
            echo "::error::The changed Fri Mads sidecar did not produce an open pull request."
            exit 1
          fi
          echo "number=$(echo "$pr_json" | jq -r .number)" >> "$GITHUB_OUTPUT"
          echo "head_sha=$(echo "$pr_json" | jq -r .headRefOid)" >> "$GITHUB_OUTPUT"

      - name: Wait for the real pull_request gate on the exact Fri Mads PR head
        id: fri-mads-required-gate
        if: github.ref == 'refs/heads/main' && steps.fri-mads-pr-head.outputs.head_sha != ''
        continue-on-error: true
        env:
          HEAD_SHA: ${{ steps.fri-mads-pr-head.outputs.head_sha }}
          GH_TOKEN: ${{ secrets.CATALOGUE_SYNC_PR_TOKEN }}
        shell: bash
        run: |
          for attempt in $(seq 1 60); do
            pr_json=$(gh pr list --base main --head automation/fri-mads-article-feed --state open --json number,headRefOid --jq '.[0]')
            pr_head=$(echo "$pr_json" | jq -r '.headRefOid // empty')
            if [ "$pr_head" != "$HEAD_SHA" ]; then
              echo "::error::Fri Mads PR head changed while waiting; refusing to use stale checks."
              exit 1
            fi
            run_json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?event=pull_request&head_sha=${HEAD_SHA}&per_page=100")
            gate=$(echo "$run_json" | jq -c --arg sha "$HEAD_SHA" '[.workflow_runs[] | select(.name == "Critical Regression Gate") | select(.head_sha == $sha)] | sort_by(.created_at) | last // empty')
            conclusion=$(echo "$gate" | jq -r '.conclusion // empty')
            status=$(echo "$gate" | jq -r '.status // empty')
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" != "success" ]; then
                echo "::error::The real pull_request Critical Regression Gate concluded $conclusion for $HEAD_SHA."
                exit 1
              fi
              current_head=$(gh pr list --base main --head automation/fri-mads-article-feed --state open --json headRefOid --jq '.[0].headRefOid // empty')
              if [ "$current_head" != "$HEAD_SHA" ]; then
                echo "::error::Fri Mads PR head changed after the gate passed; refusing auto-merge."
                exit 1
              fi
              echo "Verified Critical Regression Gate success on exact Fri Mads PR head $HEAD_SHA"
              exit 0
            fi
            sleep 20
          done
          echo "::error::Timed out waiting for the real pull_request gate on $HEAD_SHA."
          exit 1

      - name: Enable automatic merge after the exact required gate passes
        id: fri-mads-auto-merge
        if: github.ref == 'refs/heads/main' && steps.fri-mads-required-gate.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.CATALOGUE_SYNC_PR_TOKEN }}
          PR_URL: https://github.com/${{ github.repository }}/pull/${{ steps.fri-mads-pr-head.outputs.number }}
          HEAD_SHA: ${{ steps.fri-mads-pr-head.outputs.head_sha }}
        shell: bash
        run: gh pr merge --auto --merge --match-head-commit "$HEAD_SHA" "$PR_URL"

      - name: Record fail-closed Fri Mads publication status
        if: always() && github.ref == 'refs/heads/main' && (steps.fri-mads-sidecar.outcome == 'failure' || steps.fri-mads-token-preflight.outcome == 'failure' || steps.fri-mads-token-check.outcome == 'failure' || steps.fri-mads-pr.outcome == 'failure' || steps.fri-mads-pr-head.outcome == 'failure' || steps.fri-mads-required-gate.outcome == 'failure' || steps.fri-mads-auto-merge.outcome == 'failure')
        shell: bash
        run: |
          echo "::warning::Fri Mads public article metadata was not published. The source/update/token/PR/current-head gate/auto-merge step failed closed; see the step logs."
          echo "Fri Mads metadata publication did not complete. No direct write to main occurred; only an exact-head PR with the real Critical Regression Gate can publish the sidecar." >> "$GITHUB_STEP_SUMMARY"
      - name: Load bounded monitor state from #256
        uses: actions/github-script@v7
        env:
          STATE_FILE: ${{ runner.temp }}/episode-feed-pending.json
        with:
          script: |
            const fs = require("node:fs");
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: 256, per_page: 100
            });
            const stateComment = comments.find(x => String(x.body || "").includes("<!-- episode-feed-post-import-state-begin -->"));
            const match = String(stateComment?.body || "").match(/<!-- episode-feed-post-import-state-begin -->([\s\S]*?)<!-- episode-feed-post-import-state-end -->/);
            let pending = [];
            if (match) {
              try { pending = JSON.parse(match[1]).pending || []; }
              catch { core.warning("Ignoring malformed #256 monitor state; production queries remain change-scoped."); }
            }
            fs.writeFileSync(process.env.STATE_FILE, JSON.stringify(pending));
      - name: Test and run bounded production episode checks
        env:
          PODCAST_SUPABASE_URL: ${{ vars.PODCAST_SUPABASE_URL }}
          PODCAST_SUPABASE_ANON_KEY: ${{ secrets.PODCAST_SUPABASE_ANON_KEY }}
          EPISODE_FEED_BASE_SHA: ${{ github.event.before }}
          EPISODE_FEED_HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          node --experimental-strip-types scripts/test-episode-feed-coverage.mjs
          node --experimental-strip-types scripts/monitor-episode-feed-coverage.mjs "$RUNNER_TEMP/episode-feed-coverage.json"
          node --experimental-strip-types scripts/test-episode-feed-post-import.mjs
          node --experimental-strip-types scripts/episode-feed-post-import.mjs \
            --pending-file "$RUNNER_TEMP/episode-feed-pending.json" \
            --output "$RUNNER_TEMP/episode-feed-post-import.json"
      - name: Maintain deduplicated adapter review alert
        uses: actions/github-script@v7
        env:
          REPORT_FILE: ${{ runner.temp }}/episode-feed-coverage.json
        with:
          script: |
            const fs = require("node:fs");
            const crypto = require("node:crypto");
            const report = JSON.parse(fs.readFileSync(process.env.REPORT_FILE, "utf8"));
            const title = "Episode feed adapter coverage alert";
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: "open", per_page: 100
            });
            const alert = issues.find(x => !x.pull_request && x.title === title);
            if (!report.findings.length) {
              if (alert) await github.rest.issues.update({
                ...context.repo, issue_number: alert.number, state: "closed", state_reason: "completed"
              });
              core.info("Every catalogue Feed has a registered active adapter.");
              return;
            }
            const fingerprint = crypto.createHash("sha256")
              .update(JSON.stringify(report.findings)).digest("hex").slice(0, 20);
            const marker = "<!-- feed-coverage:" + fingerprint + " -->";
            const escaped = value => String(value || "").replace(/@/g, "＠").replace(/[<>]/g, "");
            const lines = report.findings.slice(0, 80).map(x =>
              "- " + escaped(x.podcast_key) + " — " + escaped(x.cause) +
                (x.title && x.title !== x.podcast_key ? " (" + escaped(x.title) + ")" : ""));
            const body = marker + "\n## Episode-feeds requiring review\n\n" +
              report.findings.length + " of " + report.catalogue_rows_with_feed +
              " catalogued Feed entries lack a safely active adapter or have an identity mismatch.\n\n" +
              "Read-only configuration check. Some entries may be archived. Confirm show, lifecycle, source GUIDs and historical rating identities before changing routing.\n" +
              "Do **not** auto-import, remap or delete episodes. The adapter check makes zero Supabase calls.\n\n" + lines.join("\n") +
              (report.findings.length > 80 ? "\n\n(Additional items omitted.)" : "") + "\n\nSee #256 for production follow-up.\n";
            if (!alert) {
              await github.rest.issues.create({ ...context.repo, title, body });
              core.warning("Opened the consolidated adapter review alert.");
            } else if (!String(alert.body || "").includes(marker)) {
              await github.rest.issues.update({ ...context.repo, issue_number: alert.number, body });
              core.warning("Updated the adapter review alert; findings changed.");
            } else {
              core.info("Adapter review findings are unchanged.");
            }
      - name: Maintain deduplicated post-import status on #256
        uses: actions/github-script@v7
        env:
          REPORT_FILE: ${{ runner.temp }}/episode-feed-post-import.json
        with:
          script: |
            const fs = require("node:fs");
            const report = JSON.parse(fs.readFileSync(process.env.REPORT_FILE, "utf8"));
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo, issue_number: 256, per_page: 100
            });
            const marker = "<!-- episode-feed-post-import-state -->";
            const existing = comments.find(x => String(x.body || "").includes(marker));
            const runUrl = context.serverUrl + "/" + context.repo.owner + "/" + context.repo.repo + "/actions/runs/" + context.runId;
            const body = report.comment_body + "\n\nKontrolkørsel: " + runUrl +
              ". Adapterreview: #288. Importhistorik/deploystatus kræver særskilt læseadgang; se #256.";
            if (!existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: 256, body });
              core.warning("Created the single deduplicated post-import status comment on #256.");
            } else if (String(existing.body || "") !== body) {
              await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
              core.info("Updated the deduplicated post-import status on #256.");
            } else {
              core.info("Post-import status is unchanged.");
            }
