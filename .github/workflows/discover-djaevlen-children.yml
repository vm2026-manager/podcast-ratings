name: Discover Djævlen children

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  actions: write
  contents: write
  pull-requests: write
  checks: write

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - name: Discover only verified new children
        id: discover
        run: node scripts/run-djaevlen-auto-discovery.mjs
      - name: Detect additive registry change
        id: changed
        run: |
          if git diff --quiet -- data/auto-discovered-djaevlen.json; then echo "value=false" >> "$GITHUB_OUTPUT"; else echo "value=true" >> "$GITHUB_OUTPUT"; fi
      - name: Regenerate staged catalogue and validate
        if: steps.changed.outputs.value == 'true'
        run: |
          node scripts/sync-sheet-data.mjs --output-dir .sync-stage
          node scripts/test-djaevlen-auto-discovery.mjs
          node scripts/test-djaevlen-umbrella-routing.mjs
          node scripts/test-community-rating-identity.mjs
          node scripts/validate-podcast-identity.mjs
          node scripts/critical-regression-gate.mjs
      - name: Create reviewable additive-registry PR
        if: steps.changed.outputs.value == 'true'
        id: pull-request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/djaevlen-discovery
          base: main
          title: "chore: add verified Djævlen child series"
          commit-message: "chore: add verified Djævlen child series"
          body: "Automated additive registry update. Unsafe, ambiguous, or colliding identities fail before a PR can be created."
          add-paths: |
            data/auto-discovered-djaevlen.json
      - name: Read current discovery PR head
        id: discovery-pr
        if: steps.changed.outputs.value == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_json=$(gh pr list --base main --head automation/djaevlen-discovery --state open --json number,headRefOid --jq '.[0]')
          if [ "$pr_json" != "null" ] && [ -n "$pr_json" ]; then
            echo "number=$(echo "$pr_json" | jq -r .number)" >> "$GITHUB_OUTPUT"
            echo "head_sha=$(echo "$pr_json" | jq -r .headRefOid)" >> "$GITHUB_OUTPUT"
          fi
      - name: Start required regression check
        id: required-check
        if: steps.discovery-pr.outputs.head_sha != ''
        uses: actions/github-script@v7
        env:
          HEAD_SHA: ${{ steps.discovery-pr.outputs.head_sha }}
        with:
          script: |
            const check = await github.rest.checks.create({
              owner: context.repo.owner, repo: context.repo.repo,
              name: "Critical Regression Gate", head_sha: process.env.HEAD_SHA,
              status: "in_progress",
              output: { title: "Critical Regression Gate", summary: "Running the required regression gate for this Djævlen registry PR." }
            });
            core.setOutput("id", String(check.data.id));
      - name: Run required regression gate against discovery PR head
        id: required-gate
        if: steps.required-check.outputs.id != ''
        env:
          HEAD_SHA: ${{ steps.discovery-pr.outputs.head_sha }}
        run: |
          git fetch --no-tags origin "$HEAD_SHA"
          git checkout --detach "$HEAD_SHA"
          node scripts/critical-regression-gate.mjs
      - name: Complete required regression check
        if: always() && steps.required-check.outputs.id != ''
        uses: actions/github-script@v7
        env:
          CHECK_ID: ${{ steps.required-check.outputs.id }}
          GATE_OUTCOME: ${{ steps.required-gate.outcome }}
        with:
          script: |
            const passed = process.env.GATE_OUTCOME === "success";
            await github.rest.checks.update({
              owner: context.repo.owner, repo: context.repo.repo,
              check_run_id: Number(process.env.CHECK_ID), status: "completed",
              conclusion: passed ? "success" : "failure",
              output: { title: "Critical Regression Gate", summary: passed ? "The required regression gate passed for this Djævlen registry PR commit." : "The required regression gate failed for this Djævlen registry PR commit." }
            });
      - name: Enable guarded auto-merge
        if: steps.required-gate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pull-request.outputs.pull-request-url }}
        run: gh pr merge --auto --merge "$PR_URL"
