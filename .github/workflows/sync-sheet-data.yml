name: Sync Podcastlisten catalogue

on:
  workflow_dispatch:
  # A workflow change on main also starts one validated catalogue sync.
  # Routine catalogue updates still use the existing schedule, not Supabase cron.
  # A workflow-only push safely triggers a one-time sync after an importer fix.
  # A further one-time push also validates recovery of the missing Flashback parent.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-sheet-data.yml"
  schedule:
    - cron: "7,37 * * * *"

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

concurrency:
  group: sync-podcast-sheet-data
  cancel-in-progress: false

jobs:
  sync-sheet-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Generate staged JSON from Google Sheets
        run: node scripts/sync-sheet-data.mjs --output-dir .sync-stage

      - name: Preserve last published timestamps for unchanged catalogue content
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from 'node:fs/promises';
          for (const file of ['data/podcasts.json', 'data/explore-clusters.json']) {
            const stagePath = `.sync-stage/${file}`;
            const [published, candidate] = await Promise.all([
              readFile(file, 'utf8'),
              readFile(stagePath, 'utf8')
            ]);
            const publishedData = JSON.parse(published);
            const candidateData = JSON.parse(candidate);
            delete publishedData.generatedAt;
            delete candidateData.generatedAt;
            if (JSON.stringify(publishedData) === JSON.stringify(candidateData)) {
              await writeFile(stagePath, published, 'utf8');
              console.log(`Unchanged ${file}: preserving existing generatedAt`);
            }
          }
          NODE

      - name: Validate staged catalogue schema
        run: |
          node -e "const fs=require('fs'); for (const path of ['.sync-stage/data/podcasts.json', '.sync-stage/data/featured-reviews.json', '.sync-stage/data/explore-clusters.json']) JSON.parse(fs.readFileSync(path,'utf8')); console.log('Staged catalogue JSON files are valid')"

      - name: Validate incomplete catalogue intake
        run: node scripts/validate-catalogue-intake.mjs --before data/podcasts.json --candidate .sync-stage/data/podcasts.json --intake .sync-stage/catalogue-intake-candidates.json

      - name: Hard podcast identity integrity gate
        id: identity-gate
        env:
          PODCAST_SUPABASE_URL: ${{ vars.PODCAST_SUPABASE_URL }}
          PODCAST_SUPABASE_ANON_KEY: ${{ secrets.PODCAST_SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -o pipefail
          node scripts/podcast-identity-integrity.mjs --before data/podcasts.json --candidate .sync-stage/data/podcasts.json --migrations data/podcast-id-migrations.json 2>&1 | tee .identity-gate.log

      - name: Alert on blocked catalogue identity
        if: failure() && steps.identity-gate.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          PODCAST_SUPABASE_URL: ${{ vars.PODCAST_SUPABASE_URL }}
          PODCAST_SUPABASE_ANON_KEY: ${{ secrets.PODCAST_SUPABASE_ANON_KEY }}
        with:
          script: |
            const { updateIdentityAlert } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/catalogue-identity-alert.mjs`);
            await updateIdentityAlert({ github, context, core, outcome: "failure" });

      - name: Resolve catalogue identity alert
        if: success() && steps.identity-gate.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const { updateIdentityAlert } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/catalogue-identity-alert.mjs`);
            await updateIdentityAlert({ github, context, core, outcome: "success" });

      - name: Promote validated staged JSON
        run: |
          cp .sync-stage/data/podcasts.json data/podcasts.json
          cp .sync-stage/data/featured-reviews.json data/featured-reviews.json
          cp .sync-stage/data/explore-clusters.json data/explore-clusters.json
          if [ -d .sync-stage/data/covers ]; then cp -R .sync-stage/data/covers/. data/covers/; fi

      - name: Validate catalogue outputs
        run: |
          node -e "const fs=require('fs'); for (const path of ['data/podcasts.json', 'data/featured-reviews.json', 'data/explore-clusters.json']) JSON.parse(fs.readFileSync(path,'utf8')); console.log('Catalogue JSON files are valid')"
          node scripts/audit-podcast-ids.mjs
          node scripts/validate-podcast-identity.mjs

      - name: Detect catalogue changes
        id: catalogue
        run: |
          if git diff --quiet -- data/podcasts.json data/featured-reviews.json data/explore-clusters.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          if git diff --quiet -- data/podcasts.json; then
            echo "podcasts_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "podcasts_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Require trusted token for unattended pull_request checks
        id: token-preflight
        if: steps.catalogue.outputs.changed == 'true'
        env:
          CATALOGUE_SYNC_PR_TOKEN: ${{ secrets.CATALOGUE_SYNC_PR_TOKEN }}
        run: |
          if [ -z "$CATALOGUE_SYNC_PR_TOKEN" ]; then
            echo "::error::CATALOGUE_SYNC_PR_TOKEN is missing. Refusing to create a catalogue PR without its real pull_request checks."
            exit 1
          fi

      - name: Verify trusted token is valid
        id: token-check
        if: steps.catalogue.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.CATALOGUE_SYNC_PR_TOKEN }}
        run: |
          if ! gh api "repos/${GITHUB_REPOSITORY}" --silent; then
            echo "::error::CATALOGUE_SYNC_PR_TOKEN is invalid, expired, or lacks repository metadata access. Refusing publication."
            exit 1
          fi

      - name: Regenerate recommendation product
        if: steps.catalogue.outputs.podcasts_changed == 'true'
        run: |
          node scripts/build-recommendation-metadata.mjs
          node scripts/build-current-podcast-similarity-product-v1.3.mjs

      - name: Validate regenerated recommendation product
        if: steps.catalogue.outputs.podcasts_changed == 'true'
        run: |
          node scripts/test-recommendation-metadata.mjs
          node scripts/test-current-podcast-similarity-product-v1.3.mjs
          node scripts/validate-recommendation-product-sync.mjs

      - name: Create or update catalogue-sync pull request
        id: create-pull-request
        if: steps.catalogue.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.CATALOGUE_SYNC_PR_TOKEN }}
          branch: automation/catalogue-sync
          base: main
          title: Sync Podcastlisten catalogue
          commit-message: "chore: sync podcast data from Google Sheets"
          body: |
            Automated, validated catalogue sync from the public Podcastlisten Google Sheet.

            The independent Critical Regression Gate workflow must pass before this PR can merge.
            If CATALOGUE_SYNC_PR_TOKEN is not configured, GitHub requires approval of the pull_request workflow; workflow_dispatch alone does not satisfy branch protection.
          add-paths: |
            data/podcasts.json
            data/featured-reviews.json
            data/explore-clusters.json
            data/recommendation-metadata.json
            data/podcast-similarity-product-v1.3.json
            data/covers/

      - name: Read current catalogue PR head
        id: catalogue-pr
        if: steps.catalogue.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_json=$(gh pr list --base main --head automation/catalogue-sync --state open --json number,headRefOid --jq '.[0]')
          if [ "$pr_json" != "null" ] && [ -n "$pr_json" ]; then
            echo "number=$(echo "$pr_json" | jq -r .number)" >> "$GITHUB_OUTPUT"
            echo "head_sha=$(echo "$pr_json" | jq -r .headRefOid)" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for the real pull_request regression gate on current PR head
        id: required-gate
        if: steps.catalogue-pr.outputs.head_sha != ''
        continue-on-error: true
        env:
          HEAD_SHA: ${{ steps.catalogue-pr.outputs.head_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 60); do
            pr_json=$(gh pr list --base main --head automation/catalogue-sync --state open --json number,headRefOid --jq '.[0]')
            pr_head=$(echo "$pr_json" | jq -r '.headRefOid // empty')
            if [ "$pr_head" != "$HEAD_SHA" ]; then
              echo "::error::Catalogue PR head changed while waiting; refusing to use a stale regression result."
              exit 1
            fi
            run_json=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?event=pull_request&head_sha=${HEAD_SHA}&per_page=100")
            gate=$(echo "$run_json" | jq -c --arg sha "$HEAD_SHA" '[.workflow_runs[] | select(.name == "Critical Regression Gate") | select(.head_sha == $sha)] | sort_by(.created_at) | last // empty')
            conclusion=$(echo "$gate" | jq -r '.conclusion // empty')
            status=$(echo "$gate" | jq -r '.status // empty')
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" != "success" ]; then
                echo "::error::The real pull_request Critical Regression Gate concluded $conclusion for $HEAD_SHA."
                exit 1
              fi
              current_head=$(gh pr list --base main --head automation/catalogue-sync --state open --json headRefOid --jq '.[0].headRefOid // empty')
              if [ "$current_head" != "$HEAD_SHA" ]; then
                echo "::error::Catalogue PR head changed after the required check passed; refusing auto-merge."
                exit 1
              fi
              echo "Verified pull_request Critical Regression Gate success on $HEAD_SHA"
              exit 0
            fi
            sleep 20
          done
          echo "::error::Timed out waiting for the real pull_request Critical Regression Gate on $HEAD_SHA."
          exit 1

      - name: Record blocked catalogue regression gate in GitHub Issues
        if: always() && (steps.token-preflight.outcome == 'failure' || steps.token-check.outcome == 'failure' || steps.create-pull-request.outcome == 'failure' || steps.required-gate.outcome == 'failure')
        uses: actions/github-script@v7
        env:
          CATALOGUE_PR_NUMBER: ${{ steps.catalogue-pr.outputs.number }}
          TOKEN_PREFLIGHT: ${{ steps.token-preflight.outcome }}
          TOKEN_CHECK: ${{ steps.token-check.outcome }}
          PR_CREATION: ${{ steps.create-pull-request.outcome }}
          GATE_OUTCOME: ${{ steps.required-gate.outcome }}
        with:
          script: |
            const title = "Catalogue sync blocked: unattended publication";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const pr = process.env.CATALOGUE_PR_NUMBER;
            const missingToken = process.env.TOKEN_PREFLIGHT === "failure";
            const body = [
              "The Google Sheet produced changes, but unattended publication is blocked. No changes were merged or published.",
              missingToken
                ? "CATALOGUE_SYNC_PR_TOKEN is missing. Add it as a repository Actions secret using a fine-grained token scoped only to this repository: Contents (read and write), Pull requests (read and write), Metadata (read). Ensure the token is valid and permitted to start pull_request workflows."
                : `Publication step outcomes: token preflight=${process.env.TOKEN_PREFLIGHT || "not run"}, token API check=${process.env.TOKEN_CHECK || "not run"}, PR creation=${process.env.PR_CREATION || "not run"}, real pull_request gate=${process.env.GATE_OUTCOME || "not run"}. Inspect the failed run step. A workflow_dispatch run does not satisfy the required pull_request check.`,
              `Failed run: ${runUrl}`,
              pr ? `Pending catalogue PR: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/pull/${pr}` : "",
              "Restore the trusted token or fix the failed workflow step. Never bypass identity safeguards or required branch protection."
            ].filter(Boolean).join("\n\n");
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: "open", per_page: 100
            });
            const existing = openIssues.find((item) => !item.pull_request && item.title === title);
            if (existing) await github.rest.issues.update({ ...context.repo, issue_number: existing.number, body, assignees: [context.repo.owner] });
            else await github.rest.issues.create({ ...context.repo, title, body, assignees: [context.repo.owner] });
            core.setFailed("Catalogue publication blocked; deduplicated issue created or updated.");

      - name: Enable automatic merge after required checks
        id: auto-merge
        if: steps.required-gate.outcome == 'success'
        env:
          # GITHUB_TOKEN is intentionally read-only for this protected PR flow.
          # Reuse the trusted repository token already checked before PR creation.
          GH_TOKEN: ${{ secrets.CATALOGUE_SYNC_PR_TOKEN }}
          PR_URL: ${{ steps.create-pull-request.outputs.pull-request-url }}
          HEAD_SHA: ${{ steps.catalogue-pr.outputs.head_sha }}
        run: |
          gh pr merge --auto --merge --match-head-commit "$HEAD_SHA" "$PR_URL"
          echo "Auto-merge enabled only after the real required pull_request gate passed on $HEAD_SHA." >> "$GITHUB_STEP_SUMMARY"

      - name: Record blocked automatic merge in GitHub Issues
        if: always() && steps.auto-merge.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          CATALOGUE_PR_NUMBER: ${{ steps.catalogue-pr.outputs.number }}
          HEAD_SHA: ${{ steps.catalogue-pr.outputs.head_sha }}
        with:
          script: |
            const title = "Catalogue sync blocked: unattended publication";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const pr = process.env.CATALOGUE_PR_NUMBER;
            const body = [
              "The Google Sheet produced changes and the real pull_request Critical Regression Gate passed, but GitHub did not accept automatic merge. No changes were merged or published.",
              `PR head SHA: ${process.env.HEAD_SHA || "unknown"}`,
              `Failed run: ${runUrl}`,
              pr ? `Pending catalogue PR: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/pull/${pr}` : "",
              "Inspect the failed automatic-merge step and repository rules. Do not bypass required checks or identity safeguards."
            ].filter(Boolean).join("\n\n");
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: "open", per_page: 100
            });
            const existing = openIssues.find((item) => !item.pull_request && item.title === title);
            if (existing) await github.rest.issues.update({ ...context.repo, issue_number: existing.number, body, assignees: [context.repo.owner] });
            else await github.rest.issues.create({ ...context.repo, title, body, assignees: [context.repo.owner] });
            core.setFailed("Automatic merge was blocked; deduplicated issue created or updated.");

  stage-verified-dr-series:
    name: Stage DR series for owner review
    needs: sync-sheet-data
    if: github.ref == 'refs/heads/main' && needs.sync-sheet-data.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: stage-verified-dr-series-only
      cancel-in-progress: false
    steps:
      - name: Checkout protected main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Authenticate with short-lived Google credentials
        if: vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER != '' && vars.GOOGLE_DR_STAGING_SERVICE_ACCOUNT != '' && vars.GOOGLE_DR_STAGING_SHEET_ID != ''
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GOOGLE_DR_STAGING_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/spreadsheets

      - name: Append source proposals only to the separate staging sheet
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          GOOGLE_DR_STAGING_SHEET_ID: ${{ vars.GOOGLE_DR_STAGING_SHEET_ID }}
          GOOGLE_DR_STAGING_WRITE_ENABLED: ${{ vars.GOOGLE_DR_STAGING_WRITE_ENABLED }}
        shell: bash
        run: |
          if [[ "$GOOGLE_DR_STAGING_WRITE_ENABLED" == "true" ]]; then
            node scripts/append-dr-series-to-staging.mjs --write
          else
            echo "DR staging writes are disabled; no Google write attempted."
            node scripts/append-dr-series-to-staging.mjs
          fi
