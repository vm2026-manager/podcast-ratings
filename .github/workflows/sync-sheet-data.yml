name: Sync Podcastlisten catalogue

on:
  workflow_dispatch:
  schedule:
    - cron: "7,37 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-podcast-sheet-data
  cancel-in-progress: false

jobs:
  sync-sheet-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate staged JSON from Google Sheets
        run: node scripts/sync-sheet-data.mjs --output-dir .sync-stage

      - name: Validate staged catalogue schema
        run: |
          node -e "const fs=require('fs'); for (const path of ['.sync-stage/data/podcasts.json', '.sync-stage/data/featured-reviews.json', '.sync-stage/data/explore-clusters.json']) JSON.parse(fs.readFileSync(path,'utf8')); console.log('Staged catalogue JSON files are valid')"

      - name: Hard podcast identity integrity gate
        env:
          PODCAST_SUPABASE_URL: ${{ vars.PODCAST_SUPABASE_URL }}
          PODCAST_SUPABASE_ANON_KEY: ${{ secrets.PODCAST_SUPABASE_ANON_KEY }}
        run: node scripts/podcast-identity-integrity.mjs --before data/podcasts.json --candidate .sync-stage/data/podcasts.json --migrations data/podcast-id-migrations.json

      - name: Promote validated staged JSON
        run: |
          cp .sync-stage/data/podcasts.json data/podcasts.json
          cp .sync-stage/data/featured-reviews.json data/featured-reviews.json
          cp .sync-stage/data/explore-clusters.json data/explore-clusters.json
          if [ -d .sync-stage/data/covers ]; then cp -R .sync-stage/data/covers/. data/covers/; fi

      - name: Validate catalogue outputs
        run: |
          node -e "const fs=require('fs'); for (const path of ['data/podcasts.json', 'data/featured-reviews.json', 'data/explore-clusters.json']) JSON.parse(fs.readFileSync(path,'utf8')); console.log('Catalogue JSON files are valid')"
          node scripts/audit-podcast-ids.mjs
          node scripts/validate-podcast-identity.mjs

      - name: Detect catalogue changes
        id: catalogue
        run: |
          if git diff --quiet -- data/podcasts.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate recommendation product
        if: steps.catalogue.outputs.changed == 'true'
        run: |
          node scripts/build-recommendation-metadata.mjs
          node scripts/build-current-podcast-similarity-product-v1.3.mjs

      - name: Validate regenerated recommendation product
        if: steps.catalogue.outputs.changed == 'true'
        run: |
          node scripts/test-recommendation-metadata.mjs
          node scripts/test-current-podcast-similarity-product-v1.3.mjs
          node scripts/validate-recommendation-product-sync.mjs

      - name: Commit updated JSON files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: sync podcast data from Google Sheets"
          file_pattern: data/podcasts.json data/featured-reviews.json data/explore-clusters.json data/recommendation-metadata.json data/podcast-similarity-product-v1.3.json
