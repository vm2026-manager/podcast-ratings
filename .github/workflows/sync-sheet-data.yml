name: Sync podcast sheet data

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"

permissions:
  contents: write

concurrency:
  group: sync-podcast-sheet-data
  cancel-in-progress: false

jobs:
  sync-sheet-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync JSON from Google Sheets
        run: node scripts/sync-sheet-data.mjs

      - name: Commit updated JSON files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: sync podcast data from Google Sheets"
          file_pattern: data/podcasts.json data/featured-reviews.json
