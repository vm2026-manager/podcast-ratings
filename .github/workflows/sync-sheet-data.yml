name: Sync Podcastlisten catalogue

on:
  workflow_dispatch:
  # A workflow change on main also starts one validated catalogue sync.
  # Routine catalogue updates still use the existing schedule, not Supabase cron.
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sync-sheet-data.yml"
  schedule:
    - cron: "7,37 * * * *"

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: sync-podcast-sheet-data
  cancel-in-progress: false

jobs:
  sync-sheet-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Generate staged JSON from Google Sheets
        run: node scripts/sync-sheet-data.mjs --output-dir .sync-stage

      - name: Validate staged catalogue schema
        run: |
          node -e "const fs=require('fs'); for (const path of ['.sync-stage/data/podcasts.json', '.sync-stage/data/featured-reviews.json', '.sync-stage/data/explore-clusters.json']) JSON.parse(fs.readFileSync(path,'utf8')); console.log('Staged catalogue JSON files are valid')"

      - name: Hard podcast identity integrity gate
        id: identity-gate
        env:
          PODCAST_SUPABASE_URL: ${{ vars.PODCAST_SUPABASE_URL }}
          PODCAST_SUPABASE_ANON_KEY: ${{ secrets.PODCAST_SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -o pipefail
          node scripts/podcast-identity-integrity.mjs --before data/podcasts.json --candidate .sync-stage/data/podcasts.json --migrations data/podcast-id-migrations.json 2>&1 | tee .identity-gate.log

      - name: Alert on blocked catalogue identity
        if: failure() && steps.identity-gate.outcome == 'failure'
        uses: actions/github-script@v7
        env:
          PODCAST_SUPABASE_URL: ${{ vars.PODCAST_SUPABASE_URL }}
          PODCAST_SUPABASE_ANON_KEY: ${{ secrets.PODCAST_SUPABASE_ANON_KEY }}
        with:
          script: |
            const { updateIdentityAlert } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/catalogue-identity-alert.mjs`);
            await updateIdentityAlert({ github, context, core, outcome: "failure" });

      - name: Resolve catalogue identity alert
        if: success() && steps.identity-gate.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const { updateIdentityAlert } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/catalogue-identity-alert.mjs`);
            await updateIdentityAlert({ github, context, core, outcome: "success" });

      - name: Promote validated staged JSON
        run: |
          cp .sync-stage/data/podcasts.json data/podcasts.json
          cp .sync-stage/data/featured-reviews.json data/featured-reviews.json
          cp .sync-stage/data/explore-clusters.json data/explore-clusters.json
          if [ -d .sync-stage/data/covers ]; then cp -R .sync-stage/data/covers/. data/covers/; fi

      - name: Validate catalogue outputs
        run: |
          node -e "const fs=require('fs'); for (const path of ['data/podcasts.json', 'data/featured-reviews.json', 'data/explore-clusters.json']) JSON.parse(fs.readFileSync(path,'utf8')); console.log('Catalogue JSON files are valid')"
          node scripts/audit-podcast-ids.mjs
          node scripts/validate-podcast-identity.mjs

      - name: Detect catalogue changes
        id: catalogue
        run: |
          if git diff --quiet -- data/podcasts.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate recommendation product
        if: steps.catalogue.outputs.changed == 'true'
        run: |
          node scripts/build-recommendation-metadata.mjs
          node scripts/build-current-podcast-similarity-product-v1.3.mjs

      - name: Validate regenerated recommendation product
        if: steps.catalogue.outputs.changed == 'true'
        run: |
          node scripts/test-recommendation-metadata.mjs
          node scripts/test-current-podcast-similarity-product-v1.3.mjs
          node scripts/validate-recommendation-product-sync.mjs

      - name: Create or update catalogue-sync pull request
        id: create-pull-request
        if: steps.catalogue.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ github.token }}
          branch: automation/catalogue-sync
          base: main
          title: Sync Podcastlisten catalogue
          commit-message: "chore: sync podcast data from Google Sheets"
          body: |
            Automated, validated catalogue sync from the public Podcastlisten Google Sheet.

            The independent Critical Regression Gate workflow must pass before this PR can merge.
            Approve its pending workflow run: PRs created with GITHUB_TOKEN require workflow approval.
          add-paths: |
            data/podcasts.json
            data/featured-reviews.json
            data/explore-clusters.json
            data/recommendation-metadata.json
            data/podcast-similarity-product-v1.3.json

      - name: Read current catalogue PR head
        id: catalogue-pr
        if: steps.catalogue.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pr_json=$(gh pr list --base main --head automation/catalogue-sync --state open --json number,headRefOid --jq '.[0]')
          if [ "$pr_json" != "null" ] && [ -n "$pr_json" ]; then
            echo "number=$(echo "$pr_json" | jq -r .number)" >> "$GITHUB_OUTPUT"
            echo "head_sha=$(echo "$pr_json" | jq -r .headRefOid)" >> "$GITHUB_OUTPUT"
          fi

      # Preflight only: never publish the independent workflow's required check here.
      # Its full verification (including Python and checkout cleanliness) must pass.
      - name: Run required regression gate against catalogue head
        id: required-gate
        if: steps.catalogue-pr.outputs.head_sha != ''
        env:
          HEAD_SHA: ${{ steps.catalogue-pr.outputs.head_sha }}
        run: |
          git fetch --no-tags origin "$HEAD_SHA"
          git checkout --detach "$HEAD_SHA"
          node scripts/critical-regression-gate.mjs

      - name: Record blocked catalogue regression gate in GitHub Issues
        if: always() && steps.required-gate.outcome == 'failure'
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          CATALOGUE_PR_NUMBER: ${{ steps.catalogue-pr.outputs.number }}
        with:
          script: |
            const title = "Catalogue sync blocked: regression gate";
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const pr = process.env.CATALOGUE_PR_NUMBER;
            const body = [
              "The Google Sheet was read and the new catalogue was staged, but the required Critical Regression Gate failed. Publication remains blocked.",
              `Failed run: ${runUrl}`,
              pr ? `Pending catalogue PR: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/pull/${pr}` : "",
              "Review the first failing regression test in the run logs. Fix the test or data issue; never bypass podcast-identity, rating, or user-data safeguards."
            ].filter(Boolean).join("\n\n");
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: "open", per_page: 100
            });
            const existing = openIssues.find((item) => !item.pull_request && item.title === title);
            if (existing) await github.rest.issues.update({ ...context.repo, issue_number: existing.number, body });
            else await github.rest.issues.create({ ...context.repo, title, body });
            core.warning("Catalogue promotion blocked. Regression gate incident recorded in GitHub Issues.");

      - name: Resolve regression gate incident on recovery
        if: always() && steps.required-gate.outcome == 'success'
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Catalogue sync blocked: regression gate";
            const openIssues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: "open", per_page: 100
            });
            const existing = openIssues.find((item) => !item.pull_request && item.title === title);
            if (existing) {
              const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              await github.rest.issues.createComment({
                ...context.repo, issue_number: existing.number,
                body: `Critical Regression Gate recovered. Successful run: ${runUrl}`
              });
              await github.rest.issues.update({
                ...context.repo, issue_number: existing.number, state: "closed", state_reason: "completed"
              });
            }

      - name: Enable automatic merge after required checks
        if: steps.required-gate.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.create-pull-request.outputs.pull-request-url }}
          HEAD_SHA: ${{ steps.catalogue-pr.outputs.head_sha }}
        run: |
          set +e
          gh pr merge --auto --merge --match-head-commit "$HEAD_SHA" "$PR_URL"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "::warning::Could not enable auto-merge for $PR_URL. The validated PR remains open for normal review/merge."
            echo "Auto-merge could not be enabled for $PR_URL; the PR remains open." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Auto-merge requested for $PR_URL. The independent Critical Regression Gate must pass; approve its pending workflow run if required." >> "$GITHUB_STEP_SUMMARY"
          fi
