name: Production catalogue health

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read
  issues: write

concurrency:
  group: production-catalogue-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Check production catalogue
        id: health-check
        shell: bash
        run: |
          set -o pipefail
          node scripts/production-catalogue-health.mjs 2>&1 | tee .production-catalogue-health.log

      - name: Alert on production catalogue failure
        if: failure() && steps.health-check.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const { updateProductionCatalogueAlert } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/production-catalogue-alert.mjs`);
            await updateProductionCatalogueAlert({ github, context, core, outcome: "failure" });

      - name: Resolve production catalogue alert
        if: success() && steps.health-check.outcome == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const { updateProductionCatalogueAlert } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/production-catalogue-alert.mjs`);
            await updateProductionCatalogueAlert({ github, context, core, outcome: "success" });
