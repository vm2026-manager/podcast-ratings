name: Production catalogue health

on:
  workflow_dispatch:
    inputs:
      resolve_incident:
        description: "Close the shared catalogue incident only after live and future sync recovery have been verified"
        type: boolean
        required: false
        default: false
  push:
    branches:
      - main
  schedule:
    - cron: "*/15 * * * *"

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: production-catalogue-health
  cancel-in-progress: false

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Read-only compare of published Google Sheets with main
        id: sheet-source-check
        shell: bash
        run: |
          set -o pipefail
          node scripts/sync-sheet-data.mjs --output-dir .sync-health 2>&1 | tee .production-catalogue-health.log
          node scripts/check-sheet-source-drift.mjs --candidate-dir .sync-health 2>&1 | tee -a .production-catalogue-health.log

      - name: Recover catalogue drift through existing sync workflow
        if: always() && steps.sheet-source-check.outcome == 'failure'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/catalogue-sync-recovery.mjs --candidate-dir .sync-health

      - name: Check scheduled sync freshness and pending catalogue PR age
        id: pipeline-watch
        if: ${{ !cancelled() && steps.sheet-source-check.outcome != 'skipped' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -o pipefail
          node scripts/catalogue-pipeline-watch.mjs 2>&1 | tee -a .production-catalogue-health.log

      - name: Check production catalogue
        id: health-check
        if: ${{ !cancelled() && steps.sheet-source-check.outcome != 'skipped' }}
        shell: bash
        run: |
          set -o pipefail
          node scripts/production-catalogue-health.mjs 2>&1 | tee -a .production-catalogue-health.log

      - name: Alert on production catalogue failure
        if: failure() && (steps.sheet-source-check.outcome == 'failure' || steps.pipeline-watch.outcome == 'failure' || steps.health-check.outcome == 'failure')
        uses: actions/github-script@v7
        with:
          script: |
            const { updateProductionCatalogueAlert } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/production-catalogue-alert.mjs`);
            await updateProductionCatalogueAlert({ github, context, core, outcome: "failure" });

      - name: Resolve production catalogue alert
        if: github.event_name == 'workflow_dispatch' && inputs.resolve_incident == true && success() && steps.sheet-source-check.outcome == 'success' && steps.pipeline-watch.outcome == 'success' && steps.health-check.outcome == 'success' && steps.health-check.outputs.pendingDeployment != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const { updateProductionCatalogueAlert } = await import(`${process.env.GITHUB_WORKSPACE}/scripts/production-catalogue-alert.mjs`);
            await updateProductionCatalogueAlert({ github, context, core, outcome: "success", resolveIncident: true });
